name: senderos-ci

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'packages/core/**'
      - 'apps/studio/**'
      - '.github/workflows/senderos-ci.yml'
      - 'package.json'
      - 'bun.lock'

jobs:
  senderos-unit:
    name: SenderOS unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:core

      - name: Build
        run: bun run build:core

      - name: Unit tests
        run: bun run --cwd packages/core test:unit

  senderos-integration:
    name: SenderOS integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-test-structure compares this branch against origin/main.
          # The default shallow checkout only has the PR's merge commit.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integration tests
        run: bun run --cwd packages/core test:integration

      - name: Coverage
        run: bun run --cwd packages/core coverage

  studio:
    name: Studio tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:studio
      - run: bun run --cwd apps/studio coverage
      - name: Studio dev-server smoke test
        run: |
          SENDEROS_DATABASE_URL=file:/tmp/senderos-studio-ci.db bun run --cwd apps/studio dev --host 127.0.0.1 > /tmp/senderos-studio.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /tmp/senderos-studio.html; then
              break
            fi
            sleep 1
          done
          grep --quiet 'Orchestration topology' /tmp/senderos-studio.html || {
            cat /tmp/senderos-studio.log
            exit 1
          }
          for route_and_copy in \
            'goals:Outcome inventory' \
            'runs:Execution history' \
            'agents:Execution topology' \
            'events:Append-only history' \
            'settings:Project &amp; database settings'; do
            route=${route_and_copy%%:*}
            copy=${route_and_copy#*:}
            curl --fail --silent "http://127.0.0.1:5173/projects/smoke/$route" |
              grep --quiet "$copy" || {
                cat /tmp/senderos-studio.log
                exit 1
              }
          done
