name: senderos-ci

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    paths:
      - 'apps/senderos/**'
      - '.github/workflows/senderos-ci.yml'
      - 'package.json'
      - 'bun.lock'

jobs:
  senderos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:senderos

      - name: Build
        run: bun run build:senderos

      - name: Test + coverage
        run: bun run --cwd apps/senderos coverage
