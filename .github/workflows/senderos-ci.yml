name: senderos-ci

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'packages/core/**'
      - 'packages/cli/**'
      - 'apps/studio/**'
      - 'scripts/**'
      - 'examples/external-host/**'
      - '.github/workflows/senderos-ci.yml'
      - 'package.json'
      - 'bun.lock'

jobs:
  senderos-unit:
    name: SenderOS unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:core

      - name: Build
        run: bun run build:core

      - name: Unit tests
        run: bun run --cwd packages/core test:unit

  senderos-integration:
    name: SenderOS integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-test-structure compares this branch against origin/main.
          # The default shallow checkout only has the PR's merge commit.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integration tests
        run: bun run --cwd packages/core test:integration

      - name: Coverage
        run: bun run --cwd packages/core coverage

  cli:
    name: CLI release (${{ matrix.os }}, ${{ matrix.parent }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        parent: [pipe, terminal]
    steps:
      - uses: actions/checkout@v4
        with:
          # release:check enforces workspace coverage and Core's test-structure
          # policy compares newly added source against origin/main.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Full release gate and installed tarball with explicit parent terminal mode
        run: env -u SENDEROS_DATABASE_URL -u SENDEROS_DATABASE_AUTH_TOKEN bun scripts/check-release-terminal.ts ${{ matrix.parent }}

  host-contract-integration:
    name: External host contract integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HOST_CONTRACT_TIMEOUT: 180s
    steps:
      - name: Prepare retained diagnostics
        run: |
          artifacts="$RUNNER_TEMP/senderos-host-contract-artifacts"
          mkdir -p "$artifacts"
          printf '%s\n' '{"schemaVersion":1,"success":false,"message":"Host contract setup did not complete; see job logs."}' > "$artifacts/report.json"
          printf '%s\n' 'Waiting for host contract setup.' > "$artifacts/run.log"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/senderos-host-contract-artifacts/install.log"
      - name: Run external-host integration contract
        shell: bash
        run: |
          artifacts="$RUNNER_TEMP/senderos-host-contract-artifacts"
          runtime=$(mktemp -d "$RUNNER_TEMP/senderos-host-contract.XXXXXX")
          cleanup() {
            result=$?
            printf 'Runner exit code: %s\n' "$result" >> "$artifacts/run.log"
            if [ ! -s "$artifacts/report.json" ]; then
              printf '{"schemaVersion":1,"success":false,"exitCode":%s,"message":"Host contract exited before writing a report (timeout or startup failure); see run.log."}\n' "$result" > "$artifacts/report.json"
            fi
            rm -rf "$runtime"
          }
          trap cleanup EXIT
          rm "$artifacts/report.json"
          # This disposable fixture uses a hard process-group deadline. A TERM
          # grace can hang if the controller exits while a child ignores TERM.
          # Do not use --foreground: it would leave children outside the timeout.
          timeout --signal=KILL "$HOST_CONTRACT_TIMEOUT" \
            bun scripts/external-host-simulation.ts \
              --runtime-root "$runtime" --output "$artifacts/report.json" \
            2>&1 | tee "$artifacts/run.log"
          test -s "$artifacts/report.json"
      - name: Retain host contract report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-contract-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/senderos-host-contract-artifacts/report.json
            ${{ runner.temp }}/senderos-host-contract-artifacts/*.log
          if-no-files-found: error
          retention-days: 7

  studio:
    name: Studio tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:studio
      - run: bun run --cwd apps/studio coverage
      - name: Build Studio production artifact
        run: bun run build:studio
      - name: Studio production-server smoke test
        run: bun run --cwd apps/studio smoke:production
      - name: Studio dev-server smoke test
        run: |
          studio_runtime=.tmp/test-runtime/studio-ci
          rm -rf "$studio_runtime"
          mkdir -p "$studio_runtime"
          export TMPDIR="$PWD/$studio_runtime"
          export TMP="$TMPDIR"
          export TEMP="$TMPDIR"
          SENDEROS_DATABASE_URL="file:$PWD/$studio_runtime/senderos.db" bun run --cwd apps/studio dev --host 127.0.0.1 > "$studio_runtime/studio.log" 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true; rm -rf "$studio_runtime"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5173/ > "$studio_runtime/studio.html"; then
              break
            fi
            sleep 1
          done
          grep --quiet 'Orchestration topology' "$studio_runtime/studio.html" || {
            cat "$studio_runtime/studio.log"
            exit 1
          }
          # Consume each response fully: grep -q can close the pipe early and
          # make curl fail under pipefail even when the expected text exists.
          for route_and_copy in \
            'goals:Outcome inventory' \
            'runs:Execution history' \
            'agents:Execution topology' \
            'events:Append-only history' \
            'settings:Project &amp; database settings'; do
            route=${route_and_copy%%:*}
            copy=${route_and_copy#*:}
            curl --fail --silent "http://127.0.0.1:5173/projects/smoke/$route" |
              grep "$copy" > /dev/null || {
                cat "$studio_runtime/studio.log"
                exit 1
              }
          done
          for sendero in \
            sendero-software-delivery \
            sendero-production-hotfix \
            sendero-security-hardening \
            sendero-dependency-upgrade \
            sendero-timed-wait-demo; do
            curl --fail --silent "http://127.0.0.1:5173/senderos/$sendero" > "$studio_runtime/sendero.html"
            test "$(grep --only-matching 'draggable-node' "$studio_runtime/sendero.html" | wc --lines)" -eq 7
            test "$(grep --only-matching 'edge-hit-target' "$studio_runtime/sendero.html" | wc --lines)" -eq 6
            test "$(grep --only-matching 'style=\"left:' "$studio_runtime/sendero.html" | wc --lines)" -eq 7
          done
          for route_and_copy in \
            'goals:Outcome inventory' \
            'runs:Execution history' \
            'agents:Execution topology' \
            'events:Append-only history' \
            'settings:Project &amp; database settings'; do
            route=${route_and_copy%%:*}
            copy=${route_and_copy#*:}
            curl --fail --silent "http://127.0.0.1:5173/$route" |
              grep "$copy" > /dev/null || exit 1
          done
